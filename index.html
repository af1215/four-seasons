<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멈춘 사계절 (프로토타입)</title>
<style>
:root{--bg:#f4f1ea;--fg:#222;--panel:#fffdf8;--line:#d8d2c4;--btn:#3b6e5a;--btnfg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--fg:#eee;--panel:#1f2428;--line:#39424a;--btn:#5fa88c;--btnfg:#10161a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--fg:#eee;--panel:#1f2428;--line:#39424a;--btn:#5fa88c;--btnfg:#10161a;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden}
#wrap{position:relative;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;pointer-events:auto}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
button.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
#bar{position:absolute;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:12px}
#box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:460px;width:100%;max-height:88%;overflow:auto}
#box h2{margin:0 0 8px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.card{width:64px;border:2px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px}
.sq{width:30px;height:30px;margin:0 auto 4px;border-radius:4px}
.card.on{outline:3px solid var(--btn)}
.r5{border-color:#e0a800}.r4{border-color:#9b59d0}.r3{border-color:#4a90d9}
small{opacity:.7}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud">
 <div class="chip">🔮 <b id="orbs">0</b></div>
 <div class="chip" id="uid" style="cursor:pointer">UID …</div>
 <div class="chip" id="roomchip" style="display:none"></div>
 <div class="chip" id="zones"></div>
</div>
<div id="toast"></div>
<div id="bar"><button class="ghost" id="bFriend">친구</button><button class="ghost" id="bMulti">멀티</button><button class="ghost" id="bParty">파티</button><button id="bGacha">뽑기</button></div>
<div id="modal"><div id="box"></div></div>
</div>
<script>
const W=2400,H=2400,cv=document.getElementById('c'),g=cv.getContext('2d');
const ZN=['봄','여름','가을','겨울'],ZC=['#a8d8a0','#5fae5f','#d9a05a','#dbe9f2'],ZD=['#8c9a8a','#7a8a7a','#8f8577','#9aa3a8'],NEED=8;
const CH=[
 {n:'까치',r:3,c:'#222',e:'speed',d:'이동속도 +'},
 {n:'도깨비',r:3,c:'#8a5a2b',e:'mag',d:'구슬 흡수범위 +'},
 {n:'해태',r:3,c:'#7aa0c8',e:'val',d:'구슬 획득량 +'},
 {n:'구미호',r:4,c:'#e8764a',e:'mag',d:'흡수범위 ++'},
 {n:'저승사자',r:4,c:'#444a66',e:'speed',d:'이동속도 ++'},
 {n:'산신',r:5,c:'#e0b040',e:'val',d:'구슬 획득량 +++'}
];
let S={orbs:30,own:{},party:[],prog:[0,0,0,0],pity:0,pulls:0};
try{const t=localStorage.getItem('fs1');if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
let A=null;try{A=JSON.parse(localStorage.getItem('fs_acct'))}catch(e){}
async function api(m,p,b){const h={'Content-Type':'application/json'};if(A){h.Authorization='Bearer '+A.token;h['X-UID']=A.uid}
 const r=await fetch(p,{method:m,headers:h,body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
function push(){if(!A)return;clearTimeout(push.t);push.t=setTimeout(()=>api('PUT','/api/save',{data:S}).catch(()=>{}),1500)}
const save=()=>{try{localStorage.setItem('fs1',JSON.stringify(S))}catch(e){}push()};
const DEF=()=>({orbs:30,own:{},party:[],prog:[0,0,0,0],pity:0,pulls:0,friends:[]});
function showUid(){document.getElementById('uid').textContent=A?'UID '+A.uid:'오프라인'}
async function init(){try{if(A){const r=await api('GET','/api/save');if(r.data&&Object.keys(r.data).length)S=Object.assign(DEF(),r.data)}
 else{A=await api('POST','/api/guest',{data:S});localStorage.setItem('fs_acct',JSON.stringify(A))}}catch(e){}
 showUid();hud();conn()}
const rnd=(a,b)=>a+Math.random()*(b-a),zone=(x,y)=>(x<W/2?0:1)+(y<H/2?0:2);
const P={x:W/2,y:H/2,s:28,vx:0,vy:0,trail:[]};
const obs=[],orbs=[];
let sd=12345;const sr=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296};
for(let i=0;i<220;i++){const x=sr()*W,y=sr()*H;if(Math.hypot(x-W/2,y-H/2)<140)continue;obs.push({x,y,w:30+sr()*30,h:30+sr()*30})}
function spawn(){const x=rnd(30,W-30),y=rnd(30,H-30);orbs.push({x,y,z:zone(x,y)})}
for(let i=0;i<70;i++)spawn();
function bonus(){let sp=0,mg=0,vl=0;S.party.forEach(n=>{const c=CH.find(k=>k.n===n),l=S.own[n]||1,m=c.r===5?3:c.r===4?2:1;
 if(c.e==='speed')sp+=.08*m*Math.min(l,5);if(c.e==='mag')mg+=30*m*Math.min(l,5);if(c.e==='val')vl+=(m-.5)*Math.min(l,5)*.5});return{sp,mg,vl}}
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let jo=null;
cv.addEventListener('pointerdown',e=>{jo={ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(jo){jo.x=e.clientX;jo.y=e.clientY}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>jo=null));
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}
function hud(){document.getElementById('orbs').textContent=S.orbs;
 document.getElementById('zones').innerHTML=ZN.map((n,i)=>S.prog[i]>=NEED?n+' ✔':n+' '+S.prog[i]+'/'+NEED).join(' · ')}
function hit(x,y,r){return obs.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function credit(z){const b=bonus(),v=Math.max(1,Math.round(1+b.vl));S.orbs+=v;if(S.prog[z]<NEED){S.prog[z]++;if(S.prog[z]===NEED)toast(ZN[z]+'이(가) 다시 깨어났어요!')}hud();save()}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(jo){const dx=jo.x-jo.ox,dy=jo.y-jo.oy,d=Math.hypot(dx,dy);if(d>8){ax=dx/Math.max(d,50);ay=dy/Math.max(d,50)}}
 const m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m}
 const b=bonus(),sp=220*(1+b.sp);
 let nx=P.x+ax*sp*dt,ny=P.y+ay*sp*dt;
 if(!hit(nx,P.y,12))P.x=Math.max(14,Math.min(W-14,nx));if(!hit(P.x,ny,12))P.y=Math.max(14,Math.min(H-14,ny));
 P.trail.unshift({x:P.x,y:P.y});if(P.trail.length>200)P.trail.pop();
 for(let i=orbs.length-1;i>=0;i--){const o=orbs[i],d=Math.hypot(o.x-P.x,o.y-P.y);
  if(room){if(d<60+b.mg&&Date.now()-(o.p||0)>800){o.p=Date.now();wsend({t:'collect',id:o.id})}continue}
  if(d<60+b.mg){o.x+=(P.x-o.x)*6*dt;o.y+=(P.y-o.y)*6*dt}
  if(d<22){orbs.splice(i,1);credit(o.z);spawn()}}
 draw(t);requestAnimationFrame(loop)}
function draw(t){const w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight;
 const cx=Math.max(0,Math.min(W-w,P.x-w/2)),cy=Math.max(0,Math.min(H-h,P.y-h/2));
 g.fillStyle='#222';g.fillRect(0,0,w,h);
 for(let i=0;i<4;i++){const zx=(i%2)*W/2-cx,zy=(i>>1)*H/2-cy;g.fillStyle=S.prog[i]>=NEED?ZC[i]:ZD[i];g.fillRect(zx,zy,W/2,H/2)}
 g.fillStyle='rgba(0,0,0,.25)';obs.forEach(o=>{if(o.x+o.w<cx||o.x>cx+w||o.y+o.h<cy||o.y>cy+h)return;
  g.fillStyle=ZN.map((_,i)=>i)[zone(o.x,o.y)]===3?'#9fb5c4':'#3d6b3a';g.fillRect(o.x-cx,o.y-cy,o.w,o.h)});
 orbs.forEach(o=>{g.fillStyle='#7b5cff';g.beginPath();g.arc(o.x-cx,o.y-cy,7+Math.sin(t/200+o.x)*1.5,0,7);g.fill();g.strokeStyle='#fff';g.stroke()});
 for(const u in others){const o=others[u];o.x+=(o.tx-o.x)*.25;o.y+=(o.ty-o.y)*.25;
  g.fillStyle='hsl('+((parseInt(u.slice(-3))*47)%360)+',70%,55%)';g.fillRect(o.x-cx-14,o.y-cy-14,28,28);g.strokeStyle='#111';g.lineWidth=2;g.strokeRect(o.x-cx-14,o.y-cy-14,28,28);
  g.font='11px sans-serif';g.textAlign='center';g.lineWidth=3;g.strokeStyle='#000';g.strokeText(u.slice(-4),o.x-cx,o.y-cy-20);g.fillStyle='#fff';g.fillText(u.slice(-4),o.x-cx,o.y-cy-20)}
 S.party.forEach((n,i)=>{const c=CH.find(k=>k.n===n),p=P.trail[Math.min(P.trail.length-1,(i+1)*22)];if(!p)return;g.fillStyle=c.c;g.fillRect(p.x-cx-11,p.y-cy-11,22,22)});
 g.fillStyle='#fff';g.fillRect(P.x-cx-14,P.y-cy-14,28,28);g.strokeStyle='#111';g.lineWidth=2;g.strokeRect(P.x-cx-14,P.y-cy-14,28,28);
 const mw=80,mx=w-mw-8,my=44;g.fillStyle='rgba(0,0,0,.4)';g.fillRect(mx,my,mw,mw);
 for(let i=0;i<4;i++){g.fillStyle=S.prog[i]>=NEED?ZC[i]:ZD[i];g.fillRect(mx+(i%2)*mw/2,my+(i>>1)*mw/2,mw/2,mw/2)}
 g.fillStyle='#fff';g.fillRect(mx+P.x/W*mw-2,my+P.y/H*mw-2,4,4);
 if(jo){g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;g.beginPath();g.arc(jo.ox,jo.oy,50,0,7);g.stroke();g.beginPath();g.arc(jo.x,jo.y,18,0,7);g.stroke()}}
const M=document.getElementById('modal'),box=document.getElementById('box');
function open(html,v){box.innerHTML=html;box.dataset.v=v||'';M.style.display='flex'}
function close(){M.style.display='none'}
M.addEventListener('click',e=>{if(e.target===M)close()});
function pull(){let r=Math.random()*100,rar=r<2?5:r<15?4:3;S.pity++;if(S.pity>=30){rar=5}if(rar===5)S.pity=0;
 const pool=CH.filter(c=>c.r===rar),c=pool[Math.floor(Math.random()*pool.length)];
 S.own[c.n]=(S.own[c.n]||0)+1;if(S.party.length<3&&!S.party.includes(c.n))S.party.push(c.n);return c}
function card(c,on){return '<div class="card r'+c.r+(on?' on':'')+'" data-n="'+c.n+'"><div class="sq" style="background:'+c.c+'"></div>'+c.n+'<br><small>'+'★'.repeat(c.r)+(S.own[c.n]?' Lv'+S.own[c.n]:'')+'</small></div>'}
function gachaUI(res){open('<h2>소원 뽑기</h2><div>🔮 '+S.orbs+' · 5성 확정까지 '+(30-S.pity)+'회<br><small>확률 5★ 2% / 4★ 13% / 3★ 85%</small></div>'+
 '<div class="row">'+(res||[]).map(c=>card(c)).join('')+'</div><div class="row"><button id="p1">1회 (10)</button><button id="p10">10회 (100)</button><button class="ghost" id="x">닫기</button></div>');
 const go=n=>{if(S.orbs<n*10){toast('구슬이 부족해요. 더 모아오세요!');return}S.orbs-=n*10;const r=[];for(let i=0;i<n;i++)r.push(pull());hud();save();gachaUI(r)};
 p1.onclick=()=>go(1);p10.onclick=()=>go(10);x.onclick=close}
function partyUI(){const own=CH.filter(c=>S.own[c.n]);
 open('<h2>파티 (최대 3명)</h2><small>눌러서 편성/해제 · 중복 획득 시 레벨업(최대 5)</small><div class="row">'+(own.length?own.map(c=>card(c,S.party.includes(c.n))).join(''):'<small>아직 동료가 없어요. 뽑기를 해보세요.</small>')+'</div>'+
 '<div><small>'+own.map(c=>c.n+': '+c.d).join('<br>')+'</small></div><div class="row"><button class="ghost" id="x">닫기</button></div>');
 box.querySelectorAll('.card').forEach(e=>e.onclick=()=>{const n=e.dataset.n,i=S.party.indexOf(n);if(i>=0)S.party.splice(i,1);else if(S.party.length<3)S.party.push(n);else toast('파티가 가득 찼어요');save();partyUI()});x.onclick=close}
function acctUI(){open('<h2>계정</h2><div>UID <b>'+(A?A.uid:'오프라인')+'</b></div>'+(A?'<div class="row"><button class="ghost" id="rc">복구코드 보기</button></div><small id="rcv"></small>':'')+
 '<h2 style="margin-top:14px">다른 기기에서 로그인</h2><div class="row"><input id="iu" placeholder="UID 9자리" inputmode="numeric" style="width:120px"><input id="ic" placeholder="복구코드" style="width:200px"></div><div class="row"><button id="lg">로그인</button><button class="ghost" id="x">닫기</button></div><small>복구코드는 비밀번호 역할이에요. 다른 사람에게 알려주지 마세요.</small>');
 if(A)rc.onclick=()=>rcv.textContent=A.token;
 lg.onclick=async()=>{const old=A;A={uid:iu.value.trim(),token:ic.value.trim()};try{const r=await api('GET','/api/save');S=Object.assign(DEF(),r.data);localStorage.setItem('fs_acct',JSON.stringify(A));localStorage.setItem('fs1',JSON.stringify(S));dead=false;if(ws){ws.onclose=null;ws.close();ws=null}leaveLocal();conn();showUid();hud();close();toast('UID '+A.uid+' 로그인 완료')}catch(e){A=old;toast('UID 또는 복구코드가 틀렸어요')}};x.onclick=close}
document.getElementById('uid').onclick=acctUI;
let ws=null,room=null,others={},FR={friends:[],incoming:[],outgoing:[]},dead=false;
function conn(){if(!A||dead||(ws&&ws.readyState<=1))return;
 try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){return}
 const w=ws;w.onopen=()=>w.send(JSON.stringify({t:'auth',uid:A.uid,token:A.token}));
 w.onmessage=e=>onMsg(JSON.parse(e.data));
 w.onclose=()=>{if(ws===w)ws=null;if(room)leaveLocal();if(!dead)setTimeout(conn,3000)}}
function wsend(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
setInterval(()=>{if(room)wsend({t:'pos',x:P.x,y:P.y})},100);setInterval(()=>wsend({t:'ping'}),25000);
function roomChip(){const e=document.getElementById('roomchip');e.style.display=room?'':'none';if(room)e.textContent='👥 방 '+room+' ('+(1+Object.keys(others).length)+'명)'}
function leaveLocal(){room=null;others={};orbs.length=0;for(let i=0;i<70;i++)spawn();roomChip()}
function onMsg(m){
 if(m.t==='authok'){FRload();return}
 if(m.t==='room'){room=m.code;others={};orbs.length=0;m.orbs.forEach(o=>orbs.push(Object.assign({},o,{z:zone(o.x,o.y)})));
  m.players.forEach(p=>{if(p.u!==A.uid)others[p.u]={x:p.x,y:p.y,tx:p.x,ty:p.y}});roomChip();toast('방 '+room+' 입장!');if(M.style.display==='flex'&&box.dataset.v!=='f')multiUI();return}
 if(m.t==='snap'){m.p.forEach(a=>{if(a[0]===A.uid)return;const o=others[a[0]]||(others[a[0]]={x:a[1],y:a[2]});o.tx=a[1];o.ty=a[2]});
  const n=m.p.length-1;if(Object.keys(others).length!==n)for(const u in others)if(!m.p.some(a=>a[0]===u))delete others[u];roomChip();return}
 if(m.t==='o'){const i=orbs.findIndex(o=>o.id===m.rm);if(i>=0)orbs.splice(i,1);if(m.add)orbs.push(Object.assign({},m.add,{z:zone(m.add.x,m.add.y)}));return}
 if(m.t==='got'){credit(m.z);return}
 if(m.t==='joined'){toast('UID '+m.uid+' 님이 입장했어요');if(box.dataset.v==='m'&&M.style.display==='flex')multiUI();return}
 if(m.t==='left'){delete others[m.uid];roomChip();toast('UID '+m.uid+' 님이 나갔어요');if(box.dataset.v==='m'&&M.style.display==='flex')multiUI();return}
 if(m.t==='inv'){open('<h2>초대</h2>UID <b>'+m.from+'</b> 님이 방 <b>'+m.code+'</b>에 초대했어요.<div class="row"><button id="ia">참가</button><button class="ghost" id="ig">무시</button></div>','i');
  ia.onclick=()=>{wsend({t:'join',code:m.code});close()};ig.onclick=close;return}
 if(m.t==='fr'){FRload();return}
 if(m.t==='err'){toast(m.m==='auth'?'계정 인증에 실패했어요':m.m);if(m.m==='auth')dead=true}}
async function FRfetch(){try{FR=await api('GET','/api/friends')}catch(e){}}
async function FRload(){await FRfetch();if(M.style.display==='flex'&&box.dataset.v==='f')friendsUI()}
const BS='style="padding:2px 8px"',CS='class="chip" style="display:block;margin:6px 0"';
function friendsUI(err){
 const fl=FR.friends.map(p=>'<div '+CS+'>'+(p.online?'🟢':'⚪')+' UID <b>'+p.uid+'</b> <small>캐릭터 '+p.chars+'/'+CH.length+' · 계절 '+p.zones+'/4</small><span style="float:right">'+(room&&p.online?'<button data-i="'+p.uid+'" '+BS+'>초대</button> ':'')+'<button class="ghost" data-d="'+p.uid+'" '+BS+'>삭제</button></span></div>').join('')||'<small>아직 친구가 없어요.</small>';
 const inc=FR.incoming.map(u=>'<div '+CS+'>UID <b>'+u+'</b> 님의 신청<span style="float:right"><button data-a="'+u+'" '+BS+'>수락</button> <button class="ghost" data-d="'+u+'" '+BS+'>거절</button></span></div>').join('');
 const out=FR.outgoing.map(u=>'<div '+CS+'>UID <b>'+u+'</b> 응답 대기 중<span style="float:right"><button class="ghost" data-d="'+u+'" '+BS+'>취소</button></span></div>').join('');
 open('<h2>친구</h2><div class="row"><input id="fu" placeholder="친구 UID 9자리" inputmode="numeric" style="width:160px"><button id="fs">친구 신청</button></div><small>'+(err||'')+'</small>'+
  (inc?'<h2 style="margin-top:12px">받은 신청</h2>'+inc:'')+(out?'<h2 style="margin-top:12px">보낸 신청</h2>'+out:'')+
  '<h2 style="margin-top:12px">내 친구 ('+FR.friends.length+')</h2>'+fl+'<div class="row"><button class="ghost" id="x">닫기</button></div>','f');
 x.onclick=close;
 fs.onclick=async()=>{const u=fu.value.trim();if(!/^\d{9}$/.test(u))return friendsUI('UID는 숫자 9자리예요.');if(u===A.uid)return friendsUI('내 UID예요.');
  try{const r=await api('POST','/api/friends/request',{uid:u});await FRfetch();friendsUI({pending:'신청했어요. 상대가 수락하면 친구가 돼요.',accepted:'서로 신청해서 바로 친구가 됐어요!',friends:'이미 친구예요.'}[r.state])}catch(e){friendsUI('해당 UID를 찾을 수 없어요.')}};
 const act=(sel,fn)=>box.querySelectorAll(sel).forEach(b=>b.onclick=fn);
 act('[data-a]',async e=>{await api('POST','/api/friends/accept',{uid:e.target.dataset.a}).catch(()=>{});await FRfetch();friendsUI()});
 act('[data-d]',async e=>{await api('POST','/api/friends/remove',{uid:e.target.dataset.d}).catch(()=>{});await FRfetch();friendsUI()});
 act('[data-i]',e=>{wsend({t:'invite',uid:e.target.dataset.i});toast('초대를 보냈어요')})}
function multiUI(){
 if(!ws||ws.readyState!==1)return toast('서버에 연결되지 않았어요');
 if(!room){open('<h2>멀티플레이</h2><small>최대 4명이 같은 월드에서 구슬을 함께 모아요.</small><div class="row"><button id="mk">방 만들기</button></div><div class="row"><input id="mc" placeholder="방 코드 4자리" maxlength="4" style="width:130px;text-transform:uppercase"><button id="mj">참가</button></div><div class="row"><button class="ghost" id="x">닫기</button></div>','m');
  mk.onclick=()=>wsend({t:'create'});mj.onclick=()=>wsend({t:'join',code:mc.value.trim().toUpperCase()});x.onclick=close;return}
 const inv=FR.friends.filter(p=>p.online&&!others[p.uid]);
 open('<h2>방 '+room+'</h2><small>코드를 알려주거나 아래에서 온라인 친구를 초대하세요.</small><div class="row">'+[A.uid].concat(Object.keys(others)).map(u=>'<div class="chip">'+(u===A.uid?'나 ':'')+u+'</div>').join('')+'</div>'+
  (inv.length?'<div class="row">'+inv.map(p=>'<button data-i="'+p.uid+'">'+p.uid+' 초대</button>').join('')+'</div>':'<small>초대할 수 있는 온라인 친구가 없어요.</small>')+
  '<div class="row"><button class="ghost" id="lv">방 나가기</button><button class="ghost" id="x">닫기</button></div>','m');
 box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{wsend({t:'invite',uid:b.dataset.i});toast('초대를 보냈어요')});
 lv.onclick=()=>{wsend({t:'leave'});leaveLocal();multiUI()};x.onclick=close}
bFriend.onclick=async()=>{if(!A)return toast('서버에 연결되지 않았어요');await FRfetch();friendsUI()};
bMulti.onclick=async()=>{await FRfetch();multiUI()};
bGacha.onclick=()=>gachaUI();bParty.onclick=partyUI;
init();hud();toast('방향키/WASD 또는 화면 드래그로 이동 · 보라 구슬을 모아 뽑기!');
requestAnimationFrame(loop);
</script>
